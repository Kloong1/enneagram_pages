<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에니어그램</title>
  <style>
    :root {
      --ink: #22211f;
      --muted: #706c65;
      --paper: #fffefa;
      --bg: #f3f1ec;
      --line: #dedbd4;
      --soft: #f8f6f1;
      --green: #eef5ee;
      --yellow: #f7f2e4;
      --red: #f6ebe8;
      --shadow: 0 18px 60px rgb(34 33 31 / 8%);
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgb(247 242 228 / 90%), transparent 31%),
        linear-gradient(135deg, #f6f4ee 0%, var(--bg) 45%, #efeee9 100%);
      line-height: 1.65;
      letter-spacing: -.02em;
    }

    .shell {
      width: min(1120px, calc(100% - 36px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 0 42px;
      display: grid;
      align-content: center;
      gap: 24px;
    }






    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(340px, .98fr);
      gap: 24px;
      align-items: stretch;
    }

    .intro {
      background: rgb(255 254 250 / 88%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(28px, 5vw, 52px);
      box-shadow: var(--shadow);
      display: grid;
      align-content: space-between;
      min-height: 500px;
      position: relative;
      overflow: hidden;
    }

    .intro::after {
      content: "";
      position: absolute;
      inset: auto -48px -58px auto;
      width: 260px;
      height: 260px;
      border: 1px solid #dfd7c7;
      border-radius: 50%;
      opacity: .7;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(42px, 7vw, 84px);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .lead {
      max-width: 580px;
      margin: 22px 0 0;
      color: #55514b;
      font-size: clamp(16px, 2vw, 19px);
      word-break: keep-all;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 32px;
      position: relative;
      z-index: 1;
    }

    .meta-row span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .panel {
      display: grid;
      gap: 14px;
    }





    .cards {
      display: grid;
      gap: 14px;
    }

    .doc-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgb(255 254 250 / 92%);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 10px 34px rgb(34 33 31 / 5%);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .doc-card:hover,
    .doc-card:focus-visible {
      border-color: #bdb6aa;
      box-shadow: 0 16px 45px rgb(34 33 31 / 10%);
      transform: translateY(-2px);
      outline: none;
    }

    .step {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 900;
    }

    .doc-card.primary .step {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .doc-copy strong {
      display: block;
      margin-bottom: 3px;
      font-size: 19px;
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    .doc-copy span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      word-break: keep-all;
    }

    .arrow {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
    }





    footer {
      color: #8b867e;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 880px) {
      .shell {
        width: min(100% - 24px, 680px);
        padding-top: 18px;
        align-content: start;
      }


      .hero {
        grid-template-columns: 1fr;
      }

      .intro {
        min-height: 420px;
      }

    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 18px, 680px);
      }




      .doc-card {
        grid-template-columns: auto 1fr;
        padding: 17px;
      }

      .arrow {
        grid-column: 2;
        justify-self: end;
      }

    }
  </style>
</head>
<body>
  <main class="shell">

    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <div>
          <div class="eyebrow">TYPE 1-9 SELF STUDY</div>
          <h1 id="page-title">에니어그램<br>탐색 노트</h1>
          <p class="lead">먼저 상세 설문으로 현재 반응 패턴을 체크하고, 이어서 유형별 워크시트에서 동기와 성장 방향을 정리하세요.</p>
        </div>
        <div class="meta-row" aria-label="문서 구성">
          <span>자가 체크</span>
          <span>유형 해석</span>
          <span>성장 워크시트</span>
        </div>
      </div>

      <div class="panel">

        <nav class="cards" aria-label="에니어그램 문서">
          <a class="doc-card primary" href="에니어그램 상세 설문지.html">
            <span class="step">01</span>
            <span class="doc-copy">
              <strong>상세 설문지</strong>
              <span>1~9번 유형별 문항을 체크하고 점수 흐름을 확인합니다.</span>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="doc-card" href="에니어그램_워크시트.html">
            <span class="step">02</span>
            <span class="doc-copy">
              <strong>유형별 워크시트</strong>
              <span>핵심 동기, 관계 패턴, 성장 방향을 유형별로 읽습니다.</span>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="doc-card" href="에니어그램_나눔.html">
            <span class="step">03</span>
            <span class="doc-copy">
              <strong>나눔 가이드</strong>
              <span>유형을 비춰 보는 질문과 대화 흐름을 따라 나눕니다.</span>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </nav>
      </div>
    </section>

    <footer>Personal enneagram study pages</footer>
  </main>
</body>
</html>
