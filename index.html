<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에니어그램</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #f6f7f9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    main {
      width: min(680px, 100%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 26px;
      color: #5f6368;
      font-size: 16px;
      line-height: 1.6;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 18px;
      font-weight: 650;
      box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
    }

    a:hover,
    a:focus-visible {
      border-color: #1a73e8;
      outline: none;
    }

    span {
      color: #1a73e8;
      font-size: 22px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main>
    <h1>에니어그램</h1>
    <p>아래 문서 중 하나를 선택하세요.</p>
    <nav aria-label="에니어그램 문서">
      <a href="에니어그램 상세 설문지.html">에니어그램 상세 설문지 <span aria-hidden="true">→</span></a>
      <a href="에니어그램_워크시트.html">에니어그램 워크시트 <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
