라고 생각했는데, 오늘 보니 조금 다르게 이해되는 행동이 있나요?", "script": "일상에서 반복되는 행동은 겉모습만 보면 비슷할 수 있어요. 중요한 건 ‘무엇을 했느냐’보다 그 행동으로 무엇을 지키려 했는지입니다. 같은 친절도 2번은 관계와 필요됨, 6번은 책임과 신뢰, 9번은 평화와 연결을 위해 할 수 있습니다.", "types": {"1": {"short": "일상 속에서 기준·질서·해야 할 일을 자연스럽게 봅니다.", "speak": "1번은 일상에서 ‘이건 이렇게 하는 게 맞지’라는 내부 기준이 비교적 선명한 편이에요. 그래서 해야 할 일, 잘못된 부분, 더 나아질 수 있는 지점이 눈에 잘 들어옵니다. 겉으로는 성실하거나 깔끔해 보일 수 있지만, 그 밑에는 ‘나는 제대로 해야 한다’는 욕구가 있어요. 일이 흐트러지거나 누군가 무책임해 보일 때 유독 답답했던 경험이 있다면, 단순한 예민함이라기보다 내 기준과 책임감이 작동했던 것일 수 있습니다.", "points": ["기준과 책임을 먼저 본다", "잘못되거나 미흡한 것을 고치려 한다", "과하면 계속 부족한 점이 보이고 긴장이 쌓일 수 있다"]}, "2": {"short": "사람의 상태와 필요를 빠르게 알아차리고 먼저 챙깁니다.", "speak": "2번은 일상에서 사람을 굉장히 빨리 봅니다. 누가 어색한지, 힘들어 보이는지, 무엇이 필요한지를 자연스럽게 알아차리고 먼저 손을 내밀 수 있어요. 단순히 착해서라기보다 ‘나는 관계 안에서 필요한 사람이고 싶다’는 욕구가 있기 때문입니다. 그래서 내 일보다 남의 일을 먼저 해주고, 나중에 ‘왜 아무도 내 마음은 몰라주지?’라는 서운함이 생겼다면 그 행동 뒤에 사랑과 필요됨에 대한 욕구가 있었을 수 있어요.", "points": ["사람의 필요를 먼저 읽는다", "도움과 돌봄으로 관계를 만든다", "과하면 내 욕구를 뒤로 미루고 서운함이 쌓일 수 있다"]}, "3": {"short": "해야 할 일과 목표를 빠르게 잡고 효율적으로 움직입니다.", "speak": "3번은 일상에서도 ‘지금 뭘 하면 가장 효과적이지?’를 빠르게 찾는 편입니다. 해야 할 일이 생기면 목표를 정하고 속도를 내며, 상황에 맞는 모습으로 적응하는 능력도 좋아요. 그런데 이 행동 밑에는 단순한 부지런함보다 ‘나는 가치 있고 유능한 사람이어야 한다’는 욕구가 있습니다. 그래서 쉬고 있는데도 뒤처지는 느낌이 들거나, 잘하고 있다는 증거가 없으면 불안했다면 성취와 인정이 자기 가치와 연결되어 있었던 것일 수 있습니다.", "points": ["목표와 성과를 중심으로 움직인다", "상황에 맞게 빠르게 적응한다", "과하면 실제 감정보다 괜찮아 보이는 모습을 먼저 만들 수 있다"]}, "4": {"short": "일상의 감정과 의미, ‘나다운가’를 중요하게 느낍니다.", "speak": "4번은 같은 일상을 살아도 그 안의 감정과 의미를 깊게 느끼는 편입니다. ‘이게 나한테 어떤 의미지?’, ‘이게 정말 나다운가?’ 같은 질문이 자연스럽게 생길 수 있어요. 그래서 남들이 별일 아니라고 하는 것도 오래 마음에 남을 수 있습니다. 이것은 단순히 감정적이라서가 아니라 ‘나는 나다운 존재로 이해받고 싶다’는 욕구와 연결돼 있어요. 특정 감정이나 결핍을 오래 곱씹었던 경험이 있다면, 그 안에서 자신의 정체성과 의미를 찾으려 했던 것일 수 있습니다.", "points": ["감정과 의미를 깊게 느낀다", "나다움과 진정성을 중요하게 본다", "과하면 결핍과 감정에 오래 머물 수 있다"]}, "5": {"short": "일단 거리를 두고 관찰하고, 충분히 이해한 뒤 움직이려 합니다.", "speak": "5번은 일상에서 바로 뛰어들기보다 한발 물러서서 상황을 이해하려는 경향이 있습니다. 혼자 생각할 시간, 충분한 정보, 내 에너지를 지킬 수 있는 공간이 중요해요. 그래서 갑작스러운 연락이나 즉석 요구가 유난히 피곤하게 느껴질 수 있습니다. 단순히 내향적이어서가 아니라 ‘충분히 알고 준비되어 있어야 한다’, ‘내 자원을 함부로 소진하고 싶지 않다’는 욕구가 있기 때문이에요. 머릿속에서는 이미 많이 알고 있는데 실행이 늦었던 경험도 여기와 연결될 수 있습니다.", "points": ["관찰하고 이해한 뒤 움직인다", "혼자만의 시간과 에너지를 중요하게 여긴다", "과하면 참여보다 준비와 생각이 길어질 수 있다"]}, "6": {"short": "상황의 위험과 변수, 믿을 만한 기준을 먼저 확인합니다.", "speak": "6번은 일상에서 ‘혹시 이런 일이 생기면?’을 자연스럽게 생각합니다. 약속, 규칙, 일정, 사람의 신뢰도를 확인하고 대비하는 힘이 좋아요. 겉으로는 꼼꼼하거나 걱정이 많아 보일 수 있지만, 그 밑에는 ‘안전하고 믿을 수 있는 기반이 필요하다’는 욕구가 있습니다. 작은 일도 미리 확인하거나 누군가의 말을 여러 번 검증했던 경험이 있다면, 그냥 우유부단해서가 아니라 위험을 줄이고 확실성을 확보하려 했던 것일 수 있습니다.", "points": ["위험과 변수를 미리 본다", "믿을 만한 기준과 사람을 확인한다", "과하면 의심과 재확인이 많아질 수 있다"]}, "7": {"short": "재미와 가능성을 찾아 일상을 가볍고 풍성하게 만들려 합니다.", "speak": "7번은 일상에서 재미있는 것, 새로운 것, 더 좋은 선택지를 빠르게 발견합니다. 계획을 세워도 하나만 보기보다 여러 가능성을 열어두는 편이고, 답답하거나 무거운 분위기를 바꾸는 힘도 있어요. 이것은 단순히 낙천적이라서가 아니라 ‘고통과 제한에 오래 갇히고 싶지 않다’는 욕구와 연결됩니다. 힘든 감정이 올라올 때 바로 다른 활동을 찾거나, 새로운 계획을 세워 분위기를 전환했다면 그 행동이 나를 불편함에서 지켜줬던 것일 수 있습니다.", "points": ["새로운 가능성과 재미를 찾는다", "불편한 분위기를 빠르게 전환한다", "과하면 깊이 머물기보다 다음 선택지로 넘어갈 수 있다"]}, "8": {"short": "문제가 생기면 직접 나서고, 주도권을 잡아 상황을 바꾸려 합니다.", "speak": "8번은 일상에서 답답한 상황을 오래 지켜보기보다 직접 움직이는 편입니다. 누가 부당하게 대우받거나 일이 너무 느리게 흘러가면 ‘그냥 내가 할게’가 나올 수 있어요. 겉으로는 강하거나 직설적으로 보이지만, 그 밑에는 ‘나는 약해지거나 통제당하지 않겠다’, ‘내 사람은 내가 지키겠다’는 욕구가 있습니다. 누군가가 나를 간섭하거나 우습게 본다고 느낄 때 유독 강하게 반응했다면, 그 순간 내 힘과 자율성을 지키려 했던 것일 수 있습니다.", "points": ["직접 나서서 상황을 바꾼다", "자율성과 힘을 중요하게 느낀다", "과하면 강한 방식이 상대에게 압박이 될 수 있다"]}, "9": {"short": "갈등을 줄이고 편안한 흐름을 유지하는 쪽으로 자연스럽게 움직입니다.", "speak": "9번은 일상에서 큰 충돌 없이 편안하게 흘러가는 것을 중요하게 느낍니다. 다른 사람의 입장을 이해하고 맞춰주는 능력도 좋아서 주변에서는 편한 사람으로 느낄 수 있어요. 그런데 그 밑에는 ‘관계가 깨지지 않았으면 좋겠다’, ‘내가 불편한 갈등 속에 들어가고 싶지 않다’는 욕구가 있습니다. 그래서 내 의견이 있어도 ‘굳이 지금 말해야 하나?’ 하고 넘기거나, 중요한 일을 미뤘다면 게으름보다는 평화와 안정감을 지키려 했던 패턴일 수 있습니다.", "points": ["분위기와 평화를 우선한다", "상대에게 맞추며 갈등을 줄인다", "과하면 내 욕구와 우선순위가 뒤로 밀릴 수 있다"]}}, "closing": "나눔을 마무리하며: ‘나는 평소 ______하게 행동해왔는데, 오늘 내 유형에 비춰보니 ______을 지키고 싶어서 그랬던 것 같다.’", "summary": "에니어그램의 차이는 거창한 사건보다 일상의 자동반응에서 더 잘 보입니다. 무엇을 먼저 보고, 무엇에 에너지를 쓰고, 불편할 때 어디로 가는지를 비교해보세요.", "teach": {"lens": "핵심 욕구 · 중심 유형 · 자동반응", "script": "여기서 중요한 건 “누가 더 부지런하고 사교적인가”가 아니에요. 별일 없을 때도 내가 자동으로 신경 쓰는 것이 무엇인지 보면 유형의 동기가 보입니다. 같은 행동을 해도 이유는 완전히 다를 수 있어요.", "contrasts": [["1번 vs 3번", "둘 다 바쁘고 성실해 보일 수 있지만, 1번은 “제대로 했는가”를, 3번은 “결과를 냈는가”를 더 민감하게 봅니다."], ["2번 vs 9번", "둘 다 상대에게 맞춰줄 수 있지만, 2번은 관계에서 필요한 사람이 되고 싶은 쪽, 9번은 갈등 없이 편안함을 유지하고 싶은 쪽에 가깝습니다."], ["4번 vs 5번", "둘 다 혼자 있는 시간이 필요해 보여도, 4번은 감정과 의미를 정리하려 물러나고 5번은 에너지와 생각을 보호하려 물러나는 경향이 있습니다."]]}, "labels": ["평소 패턴", "왜 이렇게 보이나", "균형 포인트"], "featured": true, "category": "오늘 중심 나눔"}, {"id": "time", "title": "시간을 사용하는 패턴", "badge": "오늘 중심", "kicker": "계획형인지 즉흥형인지보다, ‘왜 나는 시간을 이렇게 써왔을까?’를 봅니다.", "intent": "시간은 단순한 일정 관리가 아니라 내가 중요하게 여기는 것을 드러냅니다. 바쁨, 미룸, 준비, 여유, 즉흥성 뒤에 어떤 욕구가 있었는지 돌아봅니다.", "questions": [{"main": "나는 평소 시간을 어떤 식으로 사용하는 편인가요?", "sub": "예: 미리 계획한다 · 일정을 꽉 채운다 · 하고 싶은 것부터 한다 · 생각하다 늦어진다 · 미루다 몰아서 한다 · 여유를 지킨다"}, {"main": "내 시간 사용에서 반복되는 패턴 하나를 떠올려본다면 무엇인가요?", "sub": "쉬고 있어도 불편하다 · 준비가 충분해야 시작한다 · 다른 사람 일정 때문에 내 시간이 밀린다 · 일이 없어도 새 일을 만든다"}, {"main": "내 유형에 비춰보니, 나는 왜 시간을 그렇게 사용해왔던 것 같나요?", "sub": "무엇이 불안해서? 무엇을 놓치기 싫어서? 무엇을 증명하고 싶어서? 어떤 상태를 유지하고 싶어서?"}], "helper": "시간을 쓰는 방식에도 내 유형의 욕구나 두려움이 드러났다고 느껴지나요?", "script": "시간 사용에는 성격의 동기가 꽤 선명하게 드러납니다. 누군가는 시간을 ‘제대로 써야 한다’고 느끼고, 누군가는 ‘성과를 내야 한다’고 느끼고, 또 누군가는 ‘내 에너지를 지켜야 한다’고 느낍니다. 같은 계획형이어도 이유가 다르고, 같은 미룸이어도 이유가 다릅니다.", "types": {"1": {"short": "시간을 낭비하지 않고 ‘제대로’ 써야 마음이 편합니다.", "speak": "1번에게 시간은 단순히 흘러가는 자원이 아니라 ‘잘 써야 하는 것’에 가깝습니다. 해야 할 일이 있는데 쉬고 있으면 마음 한쪽이 불편할 수 있고, 계획이 흐트러지면 스스로를 느슨하다고 평가할 수도 있어요. 이것은 단순히 계획적이라서가 아니라 ‘나는 책임 있게, 올바르게 살아야 한다’는 내부 기준과 연결됩니다. 그래서 시간 관리를 잘하는 강점이 있지만, 쉬는 시간마저 생산적으로 써야 한다고 느끼면 휴식에도 죄책감이 생길 수 있습니다.", "points": ["해야 할 일과 우선순위를 기준으로 시간을 쓴다", "시간 낭비에 민감하다", "과하면 휴식에도 죄책감을 느낄 수 있다"]}, "2": {"short": "내 시간보다 사람과 약속, 필요한 일을 먼저 배정하기 쉽습니다.", "speak": "2번은 자기 일정만 보고 시간을 쓰기보다 사람의 필요가 들어오면 시간을 내주는 경우가 많습니다. 부탁을 받거나 누군가 힘들어하면 원래 계획을 바꾸기도 해요. 그 밑에는 ‘나는 이 사람에게 필요한 존재이고 싶다’는 욕구가 있습니다. 그래서 관계를 위해 시간을 잘 쓰지만, 내 시간을 계속 뒤로 미루다 보면 어느 순간 지치거나 ‘나는 이렇게 했는데’라는 서운함이 생길 수 있어요. 시간표를 보면 내 욕구보다 다른 사람의 필요가 더 많이 들어가 있지 않은지 살펴보는 게 포인트입니다.", "points": ["사람과 약속에 시간을 잘 내준다", "타인의 필요가 내 일정에 쉽게 들어온다", "과하면 내 시간과 휴식이 계속 뒤로 밀릴 수 있다"]}, "3": {"short": "시간을 성과와 효율로 환산하며 빈 시간을 아깝게 느낄 수 있습니다.", "speak": "3번에게 시간은 굉장히 현실적인 자산입니다. ‘이 시간에 뭘 해낼 수 있지?’가 빠르게 돌아가고, 목표가 생기면 일정도 그 목표에 맞게 압축합니다. 그래서 실행력이 좋고 짧은 시간에 많은 일을 처리할 수 있어요. 하지만 그 밑에는 ‘나는 성과를 내고 가치 있는 사람이어야 한다’는 욕구가 있습니다. 그래서 아무것도 하지 않는 시간이 불안하거나, 쉬면서도 결과를 만드는 일을 찾았다면 단순한 부지런함보다 자기 가치와 성취가 시간 사용에 연결되어 있었을 수 있습니다.", "points": ["시간을 목표와 성과 중심으로 배분한다", "빈 시간을 효율적으로 채우려 한다", "과하면 쉬는 시간도 성과로 바꾸려 할 수 있다"]}, "4": {"short": "기분과 의미가 맞아야 몰입되고, ‘나답지 않은 시간’은 공허하게 느껴질 수 있습니다.", "speak": "4번은 시간을 얼마나 많이 썼는가보다 ‘그 시간이 나에게 어떤 의미였는가’를 중요하게 느낄 수 있습니다. 마음이 맞는 일에는 오래 몰입하지만, 의미가 느껴지지 않거나 감정이 따라주지 않으면 시작이 늦어질 수도 있어요. 그 밑에는 ‘나는 나답게 살아야 한다’는 욕구가 있습니다. 그래서 일정이 꽉 찼는데도 공허하거나, 오히려 혼자 감정을 정리하는 시간이 꼭 필요했다면 시간의 양보다 정체성과 감정의 진실성이 중요했던 것일 수 있습니다.", "points": ["의미와 감정 상태에 따라 시간 몰입도가 달라진다", "나다운 시간을 중요하게 느낀다", "과하면 감정이 맞을 때까지 실행을 미룰 수 있다"]}, "5": {"short": "시간을 에너지처럼 아끼고, 충분히 준비할 시간을 확보하려 합니다.", "speak": "5번에게 시간은 곧 에너지와 비슷합니다. 갑작스러운 일정이 들어오면 단순히 시간이 부족한 게 아니라 내 정신적 자원이 침범된 느낌이 들 수 있어요. 그래서 미리 알고 준비할 수 있는 일정, 혼자 집중할 수 있는 시간이 중요합니다. ‘더 알아보고 시작해야지’ 하면서 준비 시간이 길어지는 경우도 있고요. 그 밑에는 ‘충분히 알고 준비된 상태여야 한다’, ‘내 자원을 지키고 싶다’는 욕구가 있습니다. 그래서 시간을 잘 보호하는 강점이 있지만, 준비가 완벽해질 때까지 실행을 늦추는 패턴이 생길 수 있습니다.", "points": ["혼자 집중하고 준비할 시간을 중요하게 여긴다", "갑작스러운 일정에 에너지가 크게 소모될 수 있다", "과하면 준비와 관찰이 실행을 대신할 수 있다"]}, "6": {"short": "시간을 계획하고 여유분을 두며 변수에 대비하려 합니다.", "speak": "6번은 일정 자체보다 일정이 틀어졌을 때 생길 위험까지 같이 생각하는 편입니다. 그래서 약속 시간보다 일찍 도착하거나, 플랜 B를 만들어두거나, 여러 번 확인하는 행동이 나올 수 있어요. 단순히 꼼꼼해서가 아니라 ‘예상하지 못한 상황에서 무방비해지고 싶지 않다’는 욕구 때문입니다. 계획이 확실하면 안정감을 느끼지만, 변수가 많을 때는 결정을 미루거나 확인에 시간을 많이 쓸 수 있습니다.", "points": ["변수와 돌발 상황을 고려해 시간을 계획한다", "여유 시간과 확인을 중요하게 여긴다", "과하면 준비와 재확인에 시간이 과하게 쓰일 수 있다"]}, "7": {"short": "하고 싶은 것이 많아 시간을 여러 가능성으로 채우려 합니다.", "speak": "7번은 시간이 비어 있으면 새로운 계획이나 재미있는 선택지가 금방 떠오를 수 있습니다. 하나를 끝내기 전에 또 다른 가능성을 보고, 일정도 풍성하게 채우는 편이에요. 그 밑에는 ‘지루함과 제한에 갇히고 싶지 않다’는 욕구가 있습니다. 그래서 짧은 시간에도 다양한 경험을 만들 수 있지만, 모든 선택지를 놓치기 싫어하다 보면 일정이 과하게 빽빽해지거나 깊이 집중해야 하는 일을 미룰 수 있습니다.", "points": ["여러 가능성과 경험으로 시간을 채운다", "지루함을 피하고 선택지를 열어둔다", "과하면 일정이 과밀해지고 마무리가 약해질 수 있다"]}, "8": {"short": "시간을 주도권과 실행의 문제로 보고, 답답한 지연을 싫어합니다.", "speak": "8번은 시간이 낭비되거나 결정이 미뤄지는 상황을 답답하게 느낄 수 있습니다. ‘결정했으면 하면 되지’라는 식으로 바로 움직이고, 중요한 일에는 큰 에너지를 집중합니다. 그 밑에는 ‘내 시간과 방향을 내가 통제하고 싶다’는 욕구가 있어요. 그래서 추진력이 좋지만, 다른 사람의 속도가 느리게 느껴지면 재촉하거나 내 방식대로 끌고 갈 수 있습니다. 시간 사용에서도 자율성과 주도권이 중요한 유형입니다.", "points": ["결정 후 빠르게 실행한다", "내 시간과 방향을 스스로 통제하고 싶어 한다", "과하면 다른 사람의 속도를 압박할 수 있다"]}, "9": {"short": "급한 압박보다 편안한 흐름을 선호하고, 중요하지 않은 일에 시간이 흘러갈 수 있습니다.", "speak": "9번은 일정이 너무 빡빡하거나 계속 재촉받는 상황에서 쉽게 지칠 수 있습니다. 편안한 흐름 속에서 자기 페이스를 유지할 때 안정감을 느껴요. 그런데 중요한 일도 갈등이나 부담이 예상되면 ‘조금 있다가’ 하며 미루고, 덜 중요한 일부터 하면서 시간이 흘러갈 수 있습니다. 그 밑에는 ‘불편함과 긴장을 피하고 평온을 유지하고 싶다’는 욕구가 있습니다. 그래서 여유를 만드는 강점이 있지만, 내 우선순위가 흐려지지 않는지 보는 게 중요합니다.", "points": ["자기 페이스와 여유를 중요하게 여긴다", "부담이 큰 일은 뒤로 미룰 수 있다", "과하면 중요도보다 편안함이 시간 선택을 결정할 수 있다"]}}, "closing": "나눔을 마무리하며: ‘나는 시간을 ______하게 써왔는데, 오늘 보니 ______을 지키거나 얻고 싶어서 그랬던 것 같다.’", "summary": "같은 24시간도 누구는 기준, 누구는 관계, 누구는 성취, 누구는 에너지 보존을 위해 씁니다. ‘바쁨/게으름’ 평가보다 무엇을 지키려는 시간 사용인지 보세요.", "teach": {"lens": "호니비언 · 우선순위 · 불안/통제 방식", "script": "시간 패턴은 “시간 관리를 잘한다/못한다”보다 무엇을 먼저 지키는지를 보면 훨씬 선명해져요. 시간이 모자랄 때 무엇을 포기하고 무엇을 끝까지 붙드는지가 핵심입니다.", "contrasts": [["1번 vs 6번", "둘 다 계획적일 수 있지만, 1번은 흐트러짐과 잘못을 줄이기 위해 계획하고 6번은 변수와 위험을 줄이기 위해 계획하는 편입니다."], ["3번 vs 7번", "둘 다 일정이 꽉 찰 수 있지만, 3번은 성과를 내기 위해 채우고 7번은 가능성과 경험을 놓치지 않기 위해 채우기 쉽습니다."], ["5번 vs 9번", "둘 다 일정이 많아지면 뒤로 물러날 수 있지만, 5번은 에너지 소진을 막으려 하고 9번은 압박과 긴장을 낮추려는 쪽이 더 두드러질 수 있습니다."]]}, "labels": ["시간을 쓰는 방식", "압박받을 때", "과해지면"], "featured": true, "category": "오늘 중심 나눔"}, {"id": "money", "title": "돈에 부여하는 의미", "badge": "오늘 중심", "kicker": "얼마나 쓰고 아끼는지가 아니라, 나에게 돈이 무엇을 의미해왔는지 봅니다.", "intent": "같은 금액을 써도 누구에게는 안전, 누구에게는 자유, 누구에게는 사랑이나 성취일 수 있습니다. 돈에 유독 마음이 움직였던 순간을 떠올려봅니다.", "questions": [{"main": "나는 어떤 것에는 돈을 쉽게 쓰고, 어떤 것에는 유독 아까워하나요?", "sub": "예: 경험 · 사람 · 자기계발 · 좋은 물건 · 편리함 · 저축 · 취미 · 선물"}, {"main": "나에게 돈은 단순한 돈 이상으로 어떤 의미에 가까운 것 같나요?", "sub": "안전 · 자유 · 성취 · 인정 · 즐거움 · 관계 · 독립 · 통제 · 안정 중 떠오르는 단어가 있나요?"}, {"main": "내 유형을 알고 다시 보니, 내가 돈에 그렇게 반응했던 이유가 조금 다르게 보이나요?", "sub": "돈 때문에 유난히 불안했거나, 뿌듯했거나, 아깝지 않았던 순간 하나를 떠올려보세요."}], "helper": "‘왜 나는 그 돈은 전혀 안 아까웠지?’ 또는 ‘왜 그 돈은 그렇게까지 아까웠지?’에서 시작해도 좋습니다.", "script": "돈은 성격의 동기를 드러내기 좋은 소재입니다. 어떤 사람에게 돈은 안전이고, 어떤 사람에게는 선택권이고, 어떤 사람에게는 사랑을 표현하는 수단입니다. 따라서 ‘아낀다/쓴다’보다 ‘그 돈이 나에게 무엇을 보장해줬는가’를 보면 유형의 차이가 더 잘 보입니다.", "types": {"1": {"short": "돈을 ‘올바르고 책임 있게’ 써야 한다는 기준이 분명한 편입니다.", "speak": "1번은 돈을 쓸 때도 ‘이게 합리적인가?’, ‘이건 필요한 지출인가?’ 같은 기준이 비교적 선명합니다. 무계획한 소비나 낭비를 불편하게 느낄 수 있고, 좋은 목적이나 제대로 된 품질에는 오히려 돈을 쓸 수 있어요. 그 밑에는 ‘나는 책임 있고 바르게 살아야 한다’는 욕구가 있습니다. 그래서 돈을 관리하는 힘이 좋지만, 자기 자신을 위한 소비에도 너무 엄격하거나 ‘이 정도는 사도 되나?’ 하는 죄책감이 따라올 수 있습니다.", "points": ["지출의 정당성과 필요성을 따진다", "낭비보다 책임 있는 사용을 중요하게 여긴다", "과하면 자신에게도 지나치게 엄격해질 수 있다"]}, "2": {"short": "사람에게 쓰는 돈은 비교적 덜 아깝고, 선물과 돌봄의 수단이 되기 쉽습니다.", "speak": "2번에게 돈은 관계를 표현하는 수단이 될 수 있습니다. 밥을 사주거나 선물을 하거나, 필요한 것을 챙겨주는 데 쓰는 돈은 크게 아깝지 않을 수 있어요. 그 밑에는 ‘나는 사랑을 주고받고, 필요한 사람이 되고 싶다’는 욕구가 있습니다. 그래서 사람을 따뜻하게 만드는 힘이 있지만, 상대의 반응을 은근히 기대하거나 내가 쓴 만큼 관계가 돌아오지 않을 때 서운해질 수 있습니다. 돈이 관계의 보이지 않는 교환이 되지 않는지 살펴보는 게 포인트입니다.", "points": ["사람과 관계에 돈을 잘 쓴다", "선물과 돌봄으로 마음을 표현한다", "과하면 보이지 않는 기대와 서운함이 생길 수 있다"]}, "3": {"short": "돈을 성취, 성장, 이미지와 연결해 ‘가치를 높이는 곳’에 쓰기 쉽습니다.", "speak": "3번에게 돈은 결과와 성장의 도구가 되기 쉽습니다. 자기계발, 커리어, 외모, 장비처럼 나를 더 유능하거나 매력적으로 만들어주는 데에는 비교적 과감하게 투자할 수 있어요. 반대로 아무 성과도 남지 않는 지출은 아깝게 느껴질 수 있습니다. 그 밑에는 ‘나는 가치 있고 성공적인 사람이어야 한다’는 욕구가 있습니다. 그래서 돈을 투자처럼 잘 쓰지만, 소비가 내 이미지를 증명하거나 비교 우위를 보여주는 수단이 되지 않는지 보는 게 중요합니다.", "points": ["성장과 성과를 높이는 곳에 투자한다", "돈을 자기 가치와 이미지 향상에 연결할 수 있다", "과하면 소비가 성공을 증명하는 수단이 될 수 있다"]}, "4": {"short": "취향과 의미, 나다움을 표현하는 것에는 돈을 아끼지 않을 수 있습니다.", "speak": "4번은 가격만 보지 않고 ‘이게 나한테 어떤 의미인가’를 중요하게 봅니다. 특별한 경험, 예술, 취향이 담긴 물건처럼 나다움을 표현해주는 것에는 큰돈도 아깝지 않을 수 있어요. 반대로 의미 없는 소비에는 흥미가 없을 수 있습니다. 그 밑에는 ‘나는 나다운 존재로 살고 싶다’는 욕구가 있습니다. 그래서 감각적이고 의미 있는 소비를 잘하지만, 감정이 힘들 때 결핍을 채우기 위해 특별한 무언가를 사는 패턴이 생길 수도 있습니다.", "points": ["취향과 의미가 있는 소비를 중요하게 여긴다", "나다움을 표현하는 것에 돈을 쓸 수 있다", "과하면 감정적 결핍을 소비로 채우려 할 수 있다"]}, "5": {"short": "돈을 독립성과 자원 보호의 수단으로 보고, 필요 없는 소비를 줄이려 합니다.", "speak": "5번에게 돈은 ‘내가 누구에게 의존하지 않고 살 수 있는 자원’이라는 의미가 클 수 있습니다. 꼭 필요한 것에는 지출하지만, 불필요한 소비나 과한 사회적 지출에는 거리를 둘 수 있어요. 정보, 책, 장비처럼 지식과 독립성을 높이는 것에는 돈을 쓰기도 합니다. 그 밑에는 ‘내 자원을 지키고 충분히 준비되어 있고 싶다’는 욕구가 있습니다. 그래서 재정적으로 절제하는 강점이 있지만, 돈을 너무 보호하다 경험이나 관계에 참여하는 것까지 줄이지 않는지 볼 필요가 있습니다.", "points": ["돈을 독립성과 자원 보호로 느낀다", "필요한 것과 불필요한 것을 분리한다", "과하면 경험과 관계에도 지나치게 절약할 수 있다"]}, "6": {"short": "돈은 미래의 위험을 막아주는 안전망이라는 의미가 큽니다.", "speak": "6번에게 돈은 현재의 즐거움보다 ‘혹시 모를 상황에서 나를 지켜주는 것’이라는 의미가 클 수 있습니다. 비상금, 보험, 저축, 가격 비교처럼 위험을 줄이는 행동에 마음이 놓여요. 그 밑에는 ‘나는 안전하고 대비된 상태여야 한다’는 욕구가 있습니다. 그래서 재정적으로 신중하고 위험 관리에 강하지만, 미래의 불확실성이 너무 크게 느껴지면 써도 되는 돈까지 못 쓰거나 계속 부족하다고 느낄 수 있습니다.", "points": ["저축과 안전망을 중요하게 본다", "지출 전 위험과 미래 상황을 고려한다", "과하면 충분히 있어도 계속 불안할 수 있다"]}, "7": {"short": "돈은 자유와 경험, 선택지를 넓혀주는 수단으로 느껴지기 쉽습니다.", "speak": "7번에게 돈은 ‘하고 싶은 것을 할 수 있게 해주는 자유’와 연결됩니다. 여행, 취미, 새로운 경험, 맛있는 것처럼 삶을 풍성하게 만드는 데 돈을 쓰는 걸 아깝게 느끼지 않을 수 있어요. 그 밑에는 ‘제한받지 않고 즐겁게 살고 싶다’는 욕구가 있습니다. 그래서 돈으로 삶의 가능성을 잘 확장하지만, 지금의 즐거움을 놓치고 싶지 않아 미래 계획이 약해지거나 충동적인 소비가 생길 수 있습니다.", "points": ["경험과 자유를 넓히는 데 돈을 쓴다", "즐거움과 선택권을 중요하게 여긴다", "과하면 미래 계획보다 현재의 가능성을 우선할 수 있다"]}, "8": {"short": "돈은 독립, 힘, 선택권을 지켜주는 현실적인 수단이 될 수 있습니다.", "speak": "8번에게 돈은 단순한 소비 수단보다 ‘내가 누구에게 휘둘리지 않게 해주는 힘’이라는 의미가 있을 수 있습니다. 내 사람을 보호하거나 필요할 때 큰 결정을 내리는 데에는 과감하게 쓰지만, 통제받는 느낌의 지출에는 강하게 반발할 수 있어요. 그 밑에는 ‘나는 약해지거나 의존하고 싶지 않다’는 욕구가 있습니다. 그래서 재정적 주도권을 잘 잡지만, 돈을 힘이나 관계의 주도권과 너무 강하게 연결하지 않는지 보는 게 중요합니다.", "points": ["돈을 독립과 선택권으로 느낀다", "중요한 사람과 상황에는 과감하게 쓴다", "과하면 돈이 힘과 통제의 수단이 될 수 있다"]}, "9": {"short": "돈은 편안함과 안정적인 일상을 유지하는 수단으로 느껴질 수 있습니다.", "speak": "9번에게 돈은 큰 성취나 과시보다 ‘걱정 없이 평온하게 사는 것’과 연결될 수 있습니다. 익숙한 소비 패턴을 유지하고, 큰 변화를 일으키는 재정 결정은 미루기도 해요. 그 밑에는 ‘나는 갈등과 긴장 없이 안정적으로 살고 싶다’는 욕구가 있습니다. 그래서 무리한 소비를 피하고 균형을 유지할 수 있지만, 돈 문제를 직면하는 것이 불편해서 계좌 확인이나 재정 계획을 미루는 패턴이 생길 수도 있습니다.", "points": ["편안하고 안정적인 생활을 유지하려 한다", "큰 변화보다 익숙한 소비 흐름을 선호한다", "과하면 불편한 재정 문제를 미루거나 외면할 수 있다"]}}, "closing": "나눔을 마무리하며: ‘나에게 돈  const qClass=t.questions.length===4?'questions four':'questions';
 const qs=t.questions.map((q,i)=>`<div class="q"><div class="qnum">${i+1}</div><div class="qmain">${q.main}</div><div class="qsub">${q.sub}</div></div>`).join('');
 const contrasts=(t.teach&&t.teach.contrasts||[]).map(c=>`<div class="contrast"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('');
 const summaries=Object.entries(t.types).map(([n,v])=>`<button class="type-summary" data-type="${n}"><div class="shead"><span class="badge">${n}</span><div><div class="sname">${n}번 ${TYPES[n].name}</div><div class="smeta">눌러서 설명 펼치기</div></div></div><div class="sline">${v.short}</div><div class="hint">행동 · 이유 · 과해질 때</div></button>`).join('');
 const hornevianOverview=t.id==="room"?`
 <div class="section h-special">
   <div class="sectitle"><h3>먼저, 호니비언 3개 그룹부터</h3><small>개별 유형보다 공통 방향을 먼저 봅니다</small></div>
   <div class="h-overview-grid">
     ${HORNEVIAN_GROUPS.map(g=>`<article class="h-group-card">
       <div class="h-group-top"><div class="h-group-name">${g.name}</div><div class="h-group-nums">${g.nums.join(" · ")}</div></div>
       <p class="h-group-common">${g.common}</p>
       <div class="h-group-points">
         <div class="h-group-point"><b>이 그룹의 자동 질문</b>${g.question}</div>
         <div class="h-group-point"><b>사람 많은 방에서는</b>${g.room}</div>
       </div>
       <div class="h-group-growth"><b>균형을 위해</b> · ${g.growth}</div>
     </article>`).join("")}
   </div>
 </div>
 <div class="section h-special">
   <div class="sectitle"><h3>같은 그룹 안에서도 이렇게 다릅니다</h3><small>방향은 같지만 ‘무엇을 향하는지’가 다릅니다</small></div>
   ${HORNEVIAN_GROUPS.map(g=>`<div class="h-group-section">
     <div class="h-group-section-head">
       <strong>${g.name} · ${g.nums.join(" · ")}</strong>
       <p>${g.common}</p>
     </div>
     <div class="h-type-grid">
       ${g.nums.map(n=>`<button class="type-summary h-type-card" data-type="${n}">
         <div class="shead"><span class="badge">${n}</span><div><div class="sname">${n}번 ${TYPES[n].name}</div><div class="smeta">${g.types[n][0]}</div></div></div>
         <div class="sline">${g.types[n][1]}</div>
         <div class="h-type-focus">눌러서 ${n}번 상세 설명 보기</div>
       </button>`).join("")}
     </div>
   </div>`).join("")}
 </div>`:"";

 const normalContrastSection=contrasts?`<div class="section"><div class="sectitle"><h3>비슷해 보여도 여기서 갈립니다</h3><small>행동보다 동기의 차이</small></div><div class="contrasts">${contrasts}</div></div>`:"";

 const details=Object.entries(t.types).map(([n,v])=>{
   const first=v.points?.[0]||v.short;
   const third=v.points?.[2]||TYPES[n].watch;
   return `<article class="detail" id="detail-${n}">
   <div class="dhead"><span class="badge">${n}</span><div><div class="dtitle">${n}번 ${TYPES[n].name}</div><div class="dcore">핵심 욕구 · ${TYPES[n].core}</div></div></div>
   <div class="speakbox">
     <div class="speaklabel">말로 풀면 · 먼저 이렇게 설명하기</div>
     <div class="speaktext">${v.speak}</div>
   </div>
   <div class="fields">${v.points.map((p,i)=>`<div class="field"><div class="flabel">${escLabel(t.labels,i)}</div><div class="ftext">${p}</div></div>`).join('')}</div>

   <div class="deep-explain">
     <div class="deep-title">조금 더 깊게 보면</div>
     <div class="deep-grid">
       <div class="deep-item"><b>① 이 행동에서 중요한 것</b><p>${TYPES[n].core}</p></div>
       <div class="deep-item"><b>② 그래서 실제로 나타나는 패턴</b><p>${first}</p></div>
       <div class="deep-item"><b>③ 이면에 있는 민감함</b><p>${TYPES[n].fear}에 특히 민감하기 때문에, 이 주제에서도 자신을 지키는 익숙한 방식이 반복될 수 있어요.</p></div>
       <div class="deep-item"><b>④ 잘 쓰이면 강점이 되는 부분</b><p>${TYPES[n].strength}. 같은 성향도 건강하게 쓰이면 분명한 강점이 됩니다.</p></div>
       <div class="deep-item"><b>⑤ 과해지기 시작하면</b><p>${third}</p></div>
       <div class="deep-item"><b>⑥ 균형을 위해 볼 지점</b><p>${TYPES[n].watch}을 알아차리고, 익숙한 반응 외의 선택도 가능하다는 걸 확인하는 게 중요해요.</p></div>
     </div>
     <div class="facilitator">
       <b>나눔 뒤 이렇게 연결해서 말하면 돼요</b>
       <p>“${n}번은 단순히 ‘${v.short}’인 사람이기보다, 그 행동을 통해 <strong>${TYPES[n].core}</strong>을 지키려는 경향이 있다고 볼 수 있어요. 그래서 같은 행동을 해도 이유는 다른 유형과 다를 수 있습니다. 방금 나눈 경험에서 ‘내가 그 순간 무엇을 가장 중요하게 생각했는지’를 보면 유형의 동기가 더 잘 보여요.”</p>
       <div class="reflect-q"><strong>한 번 더 물어볼 질문</strong> · “그때 그 행동을 안 했으면 무엇이 가장 불편했을 것 같아요?” / “그 행동을 통해 결국 무엇을 얻거나 지키고 싶었던 것 같아요?”</div>
     </div>
   </div>

   <div class="core-note"><b>민감한 두려움</b> · ${TYPES[n].fear}<br><b>강점</b> · ${TYPES[n].strength}<br><b>주의할 점</b> · ${TYPES[n].watch}</div>
   </article>`;
 }).join('');
 topicEl.innerHTML=`
 <div class="topichead"><div><div class="tnum">${t.category} · ${String(current+1).padStart(2,'0')}</div><h2>${t.title}</h2><p class="kicker">${t.kicker}</p></div><div class="topicbadge">${t.badge}</div></div>
 <div class="intent"><div class="label">이 나눔에서 볼 것</div><p>${t.intent}</p></div>
 <section class="phase"><div class="phasehead"><div class="step"><span class="stepnum">1</span>내 경험부터 나누기</div><span style="font-size:10.5px;color:var(--muted)">유형 설명보다 실제 경험이 먼저</span></div><div class="phasebody"><div class="sharelead"><p>먼저 1분 정도 혼자 떠올린 뒤 1:1로 이야기해보세요. 상대를 분석하기보다 “나는 실제로 이랬다”에서 시작합니다.</p><button class="timer" data-sec="480">8:00 나눔 시작</button></div><div class="solo"><b>먼저 1분, 혼자 생각하기</b><p>“나는 원래 그래”보다 최근 또는 기억에 남는 장면 하나를 떠올리면 훨씬 깊게 나눌 수 있어요.</p></div><div class="${qClass}">${qs}</div><div class="helper"><b>말이 막힐 때</b><p>${t.helper}</p></div><div class="rule"><span>상대 유형 판정 X</span><span>조언보다 경청</span><span>구체적인 장면부터</span><span>말하고 싶은 만큼만</span></div><div class="revealrow"><button class="reveal" id="reveal">나눔 끝 · 함께 해설 보기</button></div></div></section>
 <section class="phase debrief" id="debrief"><div class="phasehead"><div class="step"><span class="stepnum">2</span>유형에 비춰 다시 보기</div><button class="reveal secondary" id="hideDebrief">해설 닫기</button></div><div class="phasebody"><div class="script"><div class="label">이 주제를 설명할 때 핵심</div><p>${t.script}</p></div>${t.id==="room"?hornevianOverview:normalContrastSection}<div class="section"><div class="sectitle"><h3>${t.id==="room"?"선택한 유형을 더 자세히 보기":"1~9번은 이 주제에서 어떻게 다를까?"}</h3><small>${t.id==="room"?"위 그룹 카드에서 유형을 누르면 아래에 펼쳐집니다":"카드를 눌러 상세 설명"}</small></div>${t.id==="room"?`<div class="h-detail-intro">호니비언에서는 먼저 <b>내가 어느 방향으로 움직이는지</b>를 보고, 그다음 같은 그룹 안에서 <b>무엇을 중요하게 여겨 그렇게 움직이는지</b>를 보면 유형 차이가 더 선명해집니다.</div>`:`<div class="summary-grid">${summaries}</div>`}<div class="detail-controls"><button id="expandAll">전체 펼치기</button><button id="closeAll">전체 접기</button></div><div class="details">${details}</div></div><div class="closing"><b>한 문장으로 정리하기</b><p>${t.closing}</p></div></div></section>`;
 prev.disabled=current===0; next.disabled=current===TOPICS.length-1;
 if(app.classList.contains('show-all')) document.getElementById('debrief').classList.add('open');
 window.scrollTo({top:0,behavior:'smooth'});
}
function stopTimers(){document.querySelectorAll('.timer').forEach(btn=>{if(btn._interval){clearInterval(btn._interval);btn._interval=null;}})}
document.addEventListener('click',e=>{
 const tab=e.target.closest('.tab'); if(tab){stopTimers();current=Number(tab.dataset.i);render();return;}
 const timer=e.target.closest('.timer'); if(timer){if(timer._interval){clearInterval(timer._interval);timer._interval=null;timer.classList.remove('running');timer.textContent='8:00 나눔 시작';return;}let left=Number(timer.dataset.sec||480);timer.classList.add('running');const tick=()=>{const m=Math.floor(left/60),s=left%60;timer.textContent=`${m}:${String(s).padStart(2,'0')} · 중지`;if(left<=0){clearInterval(timer._interval);timer._interval=null;timer.classList.remove('running');timer.textContent='시간 종료 · 다시 시작';return;}left--;};tick();timer._interval=setInterval(tick,1000);return;}
 if(e.target.closest('#reveal')){document.getElementById('debrief').classList.add('open');setTimeout(()=>document.getElementById('debrief').scrollIntoView({behavior:'smooth',block:'start'}),50);return;}
 if(e.target.closest('#hideDebrief')){document.getElementById('debrief').classList.remove('open');document.querySelector('.phase').scrollIntoView({behavior:'smooth',block:'start'});return;}
 const s=e.target.closest('.type-summary'); if(s){const d=document.getElementById(`detail-${s.dataset.type}`);d.classList.toggle('open');if(d.classList.contains('open'))d.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
 if(e.target.closest('#expandAll')){document.querySelectorAll('.detail').forEach(d=>d.classList.add('open'));return;}
 if(e.target.closest('#closeAll')){document.querySelectorAll('.detail').forEach(d=>d.classList.remove('open'));return;}
});
prev.onclick=()=>{if(current>0){stopTimers();current--;render();}}; next.onclick=()=>{if(current<TOPICS.length-1){stopTimers();current++;render();}};
document.getElementById('shareMode').onclick=()=>{app.classList.remove('show-all');document.getElementById('shareMode').classList.add('active');document.getElementById('allMode').classList.remove('active');render();};
document.getElementById('allMode').onclick=()=>{app.classList.add('show-all');document.getElementById('allMode').classList.add('active');document.getElementById('shareMode').classList.remove('active');render();};
document.getElementById('larger').onclick=()=>{base=Math.min(22,base+1);root.style.setProperty('--base',base+'px')}; document.getElementById('smaller').onclick=()=>{base=Math.max(14,base-1);root.style.setProperty('--base',base+'px')};
render();
</script>
</body>
</html>
